name: osgi_api
description: >
  Abstract interfaces for a Dart-native OSGi framework: bundle lifecycle,
  service registry, and the shell transport seam. Pure Dart, no Flutter
  dependency, so headless service bundles and tests can depend on it alone.
version: 0.1.0
repository: https://github.com/jwinarske/osgi_dart
publish_to: none

environment:
  sdk: ^3.12.0

resolution: workspace

dev_dependencies:
  lints: ^5.0.0
  test: ^1.25.0
