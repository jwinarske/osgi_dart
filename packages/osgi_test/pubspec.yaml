name: osgi_test
description: >
  Test doubles and harness helpers for OSGi bundles: an in-memory shell
  transport, a fake service registry, and lifecycle assertions -- so a bundle's
  activator can be tested without a shell, an engine, or a display.
version: 0.1.0
repository: https://github.com/jwinarske/osgi_dart
publish_to: none

environment:
  sdk: ^3.12.0

resolution: workspace

dependencies:
  osgi_api: ^0.1.0
  osgi_framework: ^0.1.0

dev_dependencies:
  lints: ^5.0.0
  test: ^1.25.0
