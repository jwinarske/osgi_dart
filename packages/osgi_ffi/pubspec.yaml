name: osgi_ffi
description: >
  The FFI shell transport for the Dart OSGi framework: the ihs_osgi_* handshake
  through libihs_shared, with no Flutter dependency, so a headless bundle needs
  no UI binding to announce itself.
version: 0.1.0
repository: https://github.com/jwinarske/osgi_dart
publish_to: none

environment:
  sdk: ^3.12.0

resolution: workspace

dependencies:
  ffi: ^2.1.0
  osgi_api: ^0.1.0

dev_dependencies:
  lints: ^5.0.0
  test: ^1.25.0
