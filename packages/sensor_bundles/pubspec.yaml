name: sensor_bundles
description: >
  Native sensor OSGi service bundles — CAN (via can_engine), LIDAR, IMU.
  All CAN bus access uses can_engine from jwinarske/can_dart exclusively.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.10.0

dependencies:
  dart_osgi_api:
  dart_osgi_framework:
  can_engine:
    git:
      url: https://github.com/jwinarske/can_dart.git
      path: packages/can_engine
  can_dbc:
    git:
      url: https://github.com/jwinarske/can_dart.git
      path: packages/can_dbc
  ffi: ^2.1.0

dependency_overrides:
  can_dbc:
    git:
      url: https://github.com/jwinarske/can_dart.git
      path: packages/can_dbc

resolution: workspace
