codecov:
  require_ci_to_pass: true

coverage:
  status:
    project:
      default:
        target: auto
        threshold: 1%
    patch:
      default:
        target: 80%
        threshold: 5%

flags:
  dart_osgi_framework:
    paths:
      - packages/dart_osgi_framework/lib/
    carryforward: true
  dart_osgi_test:
    paths:
      - packages/dart_osgi_test/lib/
    carryforward: true

comment:
  layout: "reach, diff, flags, files"
  behavior: default
  require_changes: false
  require_base: false
  require_head: true

ignore:
  - "packages/*/test/"
  - "packages/ivi_homescreen_osgi/"
  - "packages/sensor_bundles/"
  - "packages/plugin_adapters/"
  - "packages/dart_osgi_flutter/"
