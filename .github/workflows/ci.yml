name: CI

on:
  push:
    branches: [main, v2.0]
  pull_request:
    branches: [main, v2.0]

env:
  DART_SDK_VERSION: stable

jobs:
  format:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: ${{ env.DART_SDK_VERSION }}

      - name: Install dependencies
        run: dart pub get

      - name: Check formatting
        run: |
          for pkg in dart_osgi_api dart_osgi_framework dart_osgi_test; do
            echo "=== Checking packages/$pkg ==="
            dart format --output=none --set-exit-if-changed packages/$pkg
          done

  analyze:
    name: Analyze (${{ matrix.package }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package:
          - dart_osgi_api
          - dart_osgi_framework
          - dart_osgi_test
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: ${{ env.DART_SDK_VERSION }}

      - name: Install dependencies
        run: dart pub get

      - name: Analyze
        run: dart analyze --fatal-infos packages/${{ matrix.package }}

  test:
    name: Test (${{ matrix.package }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package:
          - dart_osgi_framework
          - dart_osgi_test
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: ${{ env.DART_SDK_VERSION }}

      - name: Install dependencies
        run: dart pub get

      - name: Run tests with coverage
        run: dart test --coverage=packages/${{ matrix.package }}/coverage packages/${{ matrix.package }}/test/

      - name: Format coverage to LCOV
        run: |
          dart pub global activate coverage
          dart pub global run coverage:format_coverage \
            --lcov \
            --in=packages/${{ matrix.package }}/coverage \
            --out=packages/${{ matrix.package }}/coverage/lcov.info \
            --package=. \
            --report-on=lib

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: packages/${{ matrix.package }}/coverage/lcov.info
          flags: ${{ matrix.package }}
          name: ${{ matrix.package }}
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  analyze-flutter:
    name: Analyze Flutter (${{ matrix.package }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package:
          - dart_osgi_flutter
          - plugin_adapters
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install workspace dependencies
        run: dart pub get

      - name: Install Flutter package dependencies
        working-directory: packages/${{ matrix.package }}
        run: flutter pub get

      - name: Analyze
        run: dart analyze --fatal-infos packages/${{ matrix.package }}

  analyze-sensor-bundles:
    name: Analyze sensor_bundles
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: ${{ env.DART_SDK_VERSION }}

      - name: Install dependencies
        run: dart pub get

      - name: Analyze
        run: dart analyze --fatal-infos packages/sensor_bundles

  clang-format:
    name: clang-format
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Install clang-format
        run: sudo apt-get install -y clang-format

      - name: Check C++ formatting
        run: |
          clang-format --style=file --fallback-style=Google --dry-run --Werror \
            packages/ivi_homescreen_osgi/src/*.cc \
            packages/ivi_homescreen_osgi/src/*.h \
            packages/ivi_homescreen_osgi/include/ivi_homescreen_osgi/*.h
