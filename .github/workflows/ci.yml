name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Every job installs Flutter rather than the Dart SDK alone. The workspace
# resolves as a unit and osgi_flutter depends on the Flutter SDK, so `dart pub
# get` at the root cannot resolve `sdk: flutter` on a Dart-only runner.
#
# The version is pinned so a stable release cannot change what CI proves
# without a commit saying so. osgi_flutter needs Flutter >= 3.27 and every
# package needs Dart ^3.12; 3.44.9 ships Dart 3.12.2.
env:
  FLUTTER_VERSION: 3.44.9

jobs:
  static:
    name: Format and analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Resolve the workspace
        run: flutter pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed packages

      - name: Analyze
        run: dart analyze --fatal-infos

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Resolve the workspace
        run: flutter pub get

      # Run from each package root rather than passing directories to one
      # invocation: osgi_test's own library file is lib/osgi_test.dart, which
      # matches the runner's *_test.dart glob when it recurses.
      - name: Test osgi_api
        working-directory: packages/osgi_api
        run: dart test

      - name: Test osgi_framework
        working-directory: packages/osgi_framework
        run: dart test

      - name: Test osgi_ffi
        working-directory: packages/osgi_ffi
        run: dart test

      - name: Test osgi_test
        working-directory: packages/osgi_test
        run: dart test

      - name: Test osgi_flutter
        working-directory: packages/osgi_flutter
        run: flutter test

  # Coverage is a separate job rather than extra flags on the one above, for
  # two reasons: the test signal stays fast and unconditional, and a failure in
  # the coverage tooling cannot turn a green suite red. It is instrumentation,
  # not a gate -- there is deliberately no threshold, because every defect found
  # in this framework so far (a tracker replay race, a detach deadlock, a
  # message case never handled) sat in lines that were already covered.
  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Resolve the workspace
        run: flutter pub get

      - name: Install the coverage tool
        run: dart pub global activate coverage

      # --report-on=lib is load-bearing: without it the report covers the test
      # files themselves, which measures nothing about the library.
      - name: Collect (pure-Dart packages)
        run: |
          set -euo pipefail
          for p in osgi_api osgi_ffi osgi_framework osgi_test; do
            ( cd "packages/$p"
              dart test --coverage=coverage
              dart pub global run coverage:format_coverage \
                --lcov --in=coverage --out=coverage/lcov.info \
                --report-on=lib )
          done

      # flutter test writes lcov directly, so it needs no conversion.
      - name: Collect (osgi_flutter)
        working-directory: packages/osgi_flutter
        run: flutter test --coverage

      - name: Summarise
        run: |
          sudo apt-get update && sudo apt-get install -y lcov
          for f in packages/*/coverage/lcov.info; do
            echo "== $f"
            lcov --summary "$f" 2>&1 | grep -E 'lines|functions' || true
          done

      - name: Upload lcov
        uses: actions/upload-artifact@v4
        with:
          name: dart-coverage
          path: packages/*/coverage/lcov.info
          retention-days: 7
