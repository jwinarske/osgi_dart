name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Every job installs Flutter rather than the Dart SDK alone. The workspace
# resolves as a unit and osgi_flutter depends on the Flutter SDK, so `dart pub
# get` at the root cannot resolve `sdk: flutter` on a Dart-only runner.
#
# The version is pinned so a stable release cannot change what CI proves
# without a commit saying so. osgi_flutter needs Flutter >= 3.27 and every
# package needs Dart ^3.12; 3.44.9 ships Dart 3.12.2.
env:
  FLUTTER_VERSION: 3.44.9

jobs:
  static:
    name: Format and analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Resolve the workspace
        run: flutter pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed packages

      - name: Analyze
        run: dart analyze --fatal-infos

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Resolve the workspace
        run: flutter pub get

      # Run from each package root rather than passing directories to one
      # invocation: osgi_test's own library file is lib/osgi_test.dart, which
      # matches the runner's *_test.dart glob when it recurses.
      - name: Test osgi_api
        working-directory: packages/osgi_api
        run: dart test

      - name: Test osgi_framework
        working-directory: packages/osgi_framework
        run: dart test

      - name: Test osgi_test
        working-directory: packages/osgi_test
        run: dart test

      - name: Test osgi_flutter
        working-directory: packages/osgi_flutter
        run: flutter test
